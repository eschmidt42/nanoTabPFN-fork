[project]
name = "nanotabpfn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eschmidt42", email = "11818904+eschmidt42@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.3",
    "openml>=0.15.1",
    "schedulefree>=1.4.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "plotnine>=0.15.7",
]

[project.scripts]
nanotabpfn = "nanotabpfn:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]

test = [
    "pytest>=9.0.3",
]

quality = [
    "ruff>=0.15.7",
    "ty>=0.0.25",
]

notebooks = [
    "ipywidgets>=8.1.8",
    "jupyter-server>=2.18.0",
    "mistune>=3.2.1",
    "nbconvert>=7.17.1",
    "notebook>=7.5.6",
    "pillow>=12.2.0",
]

dev = [
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "notebooks" },
    "prek>=0.5.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# https://docs.astral.sh/ruff/rules/
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 100
indent-width = 4
target-version = "py314"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

[tool.ruff.lint.pydocstyle]
convention = "google"
